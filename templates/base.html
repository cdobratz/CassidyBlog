<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cassidy Dobratz{% endblock %}</title>
    <meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14181c" media="(prefers-color-scheme: dark)">
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Geist:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip" href="#content">Skip to content</a>
    <header class="mast">
        <a class="mark" href="{{ url_for('index') }}" aria-label="Cassidy Dobratz, home">
            <svg class="mark__glyph" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21V10"/>
                <path d="M12 14c-4-1-6-4-6-7 4 0 6 2 6 7z"/>
                <path d="M12 12c3-2 6-2 8-1-1 4-4 5-8 5z"/>
            </svg>
        </a>
        <div class="mast__end">
            <button type="button" class="icon-button" data-theme-toggle aria-label="Switch to night" title="Switch to night">
                <svg class="sun" viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="10" cy="10" r="3.2" fill="currentColor"/>
                    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <path d="M10 2.2v1.6M10 16.2v1.6M17.8 10h-1.6M3.8 10H2.2"/>
                        <path d="M15.5 4.5l-1.1 1.1M5.6 14.4l-1.1 1.1M15.5 15.5l-1.1-1.1M5.6 5.6L4.5 4.5"/>
                    </g>
                </svg>
                <svg class="moon" viewBox="0 0 20 20" aria-hidden="true">
                    <path fill="currentColor" d="M12.2 2.4a7.2 7.2 0 1 0 5.4 11.6A6.2 6.2 0 0 1 12.2 2.4z"/>
                </svg>
            </button>
            <nav class="mast__pages" aria-label="Pages">
                <a href="{{ url_for('blog') }}" {% if request.endpoint == 'blog' %}aria-current="page"{% endif %}>Blog</a>
                <a href="{{ url_for('projects') }}" {% if request.endpoint == 'projects' %}aria-current="page"{% endif %}>Projects</a>
                <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a>
            </nav>
            <nav class="elsewhere" aria-label="Elsewhere">
                <a class="icon-button" href="https://twitter.com/cdobratz" target="_blank" rel="noopener noreferrer" aria-label="Cassidy on X (opens in a new tab)" title="Cassidy on X">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 10.3 21.4 3h-1.6l-5.8 6.4L9.3 3H3.4l7 9.8L3.4 21h1.6l6.1-6.8 4.9 6.8h5.9l-7.2-10.7zm-2.2 2.4-.7-1-5.6-7.7h2.4l4.5 6.3.7 1 5.9 8.1h-2.4l-4.8-6.7z"/></svg>
                </a>
                <a class="icon-button" href="https://github.com/cdobratz" target="_blank" rel="noopener noreferrer" aria-label="Cassidy on GitHub (opens in a new tab)" title="Cassidy on GitHub">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.87c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                </a>
            </nav>
        </div>
    </header>
    <main id="content">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
