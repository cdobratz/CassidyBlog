{% extends "base.html" %}

{% block title %}New Article | Cassidy Dobratz{% endblock %}

{% block content %}
<div class="page page--prose">
    <p class="kicker">Draft</p>
    <h1>New article</h1>
    <form class="composer" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="Article title">
        </div>
        <div>
            <label for="content">Content, Markdown supported</label>
            <textarea id="content" name="content" required placeholder="Write the article in Markdown"></textarea>
        </div>
        <div class="composer__actions">
            <button class="seam" type="submit">Publish article</button>
            <a class="ghost" href="{{ url_for('blog') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
